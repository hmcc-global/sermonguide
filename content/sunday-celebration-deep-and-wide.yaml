series: Sunday Celebration
part: Deep and Wide
date: '2026-08-23'
preacher: Pastor Pete Dahlem
scripture_title: Isaiah 53:1-3
scripture_ref: Isaiah 53:1-3
recap:
  - 'Pastor Pete used this Sunday to reflect back on the two-year "Deep and Wide" theme before the church shares its new annual theme in a few weeks. The idea has been simple: the deeper our walk with Christ is, the wider our witness to the world will be. To ground that reflection, Pastor Pete turned to Isaiah 54:1-3, a prophecy given to the people of Judah during their 70 years of exile in Babylon, exile that came because they had rebelled against God and fallen into idolatry.'
  - 'In the passage, the people are pictured as a barren, desolate woman, an image that carried deep social shame and practical hardship in that world. Yet God calls this barren woman to sing and cry aloud for joy, and to do it before any sign of labor has even come. That reaction makes no sense on its own, so Pastor Pete pointed to the reason at the end of verse 1: a promise that the children of the desolate one will be more than the children of the married woman. Looking back through Scripture at the seven barren women who gave birth, from Sarah to Elizabeth, the promise starts to look like a pattern rooted in God''s consistent character. He tied this to Isaiah 53 right before it, the suffering servant who would bear the people''s sin, announcing 700 years early what Jesus would do on the cross.'
  - 'Pastor Pete connected this to moments from the church''s recent life. He recalled the Acts 16 study of Paul and Silas worshiping in the inner prison, and asked what "inner prisons" and exiles people feel trapped in today. He revisited Pastor Paul Kim''s picture of not rowing the boat but raising the sails to catch the grace of God, and the Two Trees tool for applying the gospel to everyday frustrations. The point held throughout: we can worship in exile only when our hope rests on the promise of redemption in Jesus, not on our circumstances.'
  - 'Verse 2 then calls the people to enlarge their tent, lengthen the cords, and strengthen the stakes, picturing the huge, expansive desert tents that shelter many people rather than a small family. Long cords stretch wide, deep stakes hold firm, going wide requires going deep. Pastor Pete celebrated how the church had grown deeper through the Bible reading program, the One Desire fast, and the "make room" retreat, even sharing that his mother passed away during that retreat and how being with his spiritual family sustained him. That depth produced width: a new outreach team, students sharing faith on campus, and new people joining all the time. Verse 3''s promise that "your offspring will possess the nations" was spoken to a people with no army or freedom, a promise that could only be received by faith, and the same call the church carries now.'
one_thing: Worship in faith and enlarge our tent for the nations.
discussion_questions:
  Connecting:
    - When you look back at old photos or memories from the past year, what tends to stand out to you most?
    - What comes to mind when you picture a tent, and how does that compare to a large Near Eastern tent?
  Considering:
    - In Isaiah 54:1-3, what is God asking the barren woman to do, and what reason does the text give for it?
    - How does Isaiah 53, right before this passage, shape the hope being offered in Isaiah 54?
  Confessing:
    - Where in your life right now do you feel stuck in an "exile" or "inner prison" that seems too big for you?
    - Have you been rowing the boat in your own strength instead of raising the sails to God's grace?
  Committing:
    - What is one area where you can go deeper with God that you started before but let fall off?
    - Who is one person in your life you can reach out to as a way of enlarging the tent this season?
next_steps:
  - Worship this week based on God's promises rather than your circumstances.
  - Recommit to a deeper daily habit with God, like the Bible reading program or focused prayer.
  - Take one concrete step to welcome someone new, on campus, at work, or in your neighborhood.
