series: Family of God
date: '2026-11-08'
preacher: Pastor Young Kim
scripture_title: Matthew 12:46-50 and various passages
scripture_ref: Matthew 12:46-50 and various passages
recap:
  - 'Pastor Young Kim, visiting to welcome HMCC of Ann Arbor into the AMI family of churches, began by introducing his own family and then sharing a snapshot of AMI: about 22 churches in the US and 15 or so abroad, in places like Guatemala, Italy, and Vietnam. His message was that Jesus redefined family. In Matthew 12:46-50, Jesus says that whoever does the will of his Father is his brother, sister, and mother. Those who receive Christ are children of God by the blood of Christ and by God''s will (John 1:12-13), so every believer in the room is already family, whatever their background. He then named four family matters to strengthen: unity, spiritual battle, investment in the future, and fun.'
  - 'On unity, he drew from Romans 12 and 1 Corinthians 12 to say that a family is diverse and still one. If the whole body were an eye, there would be no hearing, and God has placed each part in the body as he wanted. He told the story of a busy PhD student who offered to help and ended up as the college ministry''s van driver, and his gentle, humble service became a quiet reason the ministry grew. Pastor Young suggested that some people may feel they do not fit, but God may have placed them there to strengthen what is weak. The way to keep unity is to become like Jesus, as Ephesians 4:2-3 urges: be humble, gentle, and patient, and make every effort to keep the unity of the Spirit. Complaining, holding grudges, and pointing out flaws without prayer or humility divide a church. He shared how his wife, after a year of her grown children voicing their hurts during COVID, gathered the family and asked for forgiveness, and how that humility made them closer.'
  - On spiritual battle, he said the family is not a social club but an army with a mission to advance God's kingdom, not its own agenda. Drawing on Matthew 16:18, 1 Timothy 6, Ephesians 6:12, and 2 Corinthians 10, he reminded the church that the struggle is against spiritual forces and the weapons are spiritual, namely prayer and the Word of God. He said that dinner with the elders the night before showed him leaders who pray, and he encouraged HMCC to keep fighting together. On the future, he cited Psalm 78 and 2 Timothy 2:2, calling the church to tell the next generation what God has done, and celebrated that HMCC is reaching young people. He pointed to the pattern of Paul training Timothy and Timothy training reliable others, and to churches that raise campus, youth, and children's ministries together.
  - 'On fun, he spoke of the joy of the Lord, which he said runs through Scripture: Psalm 16:11, Habakkuk 3:17-18, Hebrews 12:2, John 15, and Nehemiah 8:10. Joy does not depend on easy circumstances, because Jesus endured the cross for the joy set before him. He admitted that he grew up in a Christian culture focused on sacrifice and was weak at showing joy, and a former student told him he had been very serious in his early ministry. As he prepares to retire from his church next year and help start campus ministries, he said he wants to be marked by joy as he gets older. He closed by calling HMCC to unite, fight the spiritual battle together, raise future leaders, and enjoy doing it, then prayed for those who feel they do not belong.'
one_thing: Strengthen the family of God through unity, spiritual battle, the next generation, and joy.
discussion_questions:
  Connecting:
    - What is a family tradition or trip that you remember most fondly, and why?
    - Is there a time you were welcomed into a new group or community? What made you feel at home?
  Considering:
    - In Matthew 12:46-50, who does Jesus say are his family, and what does that mean for how we relate to other believers?
    - What does 1 Corinthians 12 say about the differences among the members of the body, and why does God place each one as he wants?
  Confessing:
    - Do you ever feel like you do not belong in this church, or look down on others who seem different? What is behind that?
    - When you notice a flaw in your church or in others, do you tend to pray and speak humbly, or complain and hold a grudge?
  Committing:
    - What is one way you could serve or step in to strengthen the unity of your church this month?
    - Who in the next generation could you encourage, train, or pray for in the coming weeks?
next_steps:
  - Reach out to someone in the church who is different from you and learn their story over a meal or coffee.
  - Pick one grudge or complaint, pray for that person or issue daily this week, and take a humble step toward peace if needed.
  - Choose a time this week to pray for the church and its leaders, and bring one spiritual battle to the Lord in prayer and the Word.
