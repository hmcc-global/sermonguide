series: Higher Calling
part: '7'
date: '2026-11-01'
preacher: Pastor Pete Dahlem
scripture_title: Ephesians 2:8-10
scripture_ref: Ephesians 2:8-10
recap:
  - 'In the seventh week of the Higher Calling series, Pastor Pete turned to Ephesians 2:8-10 to explore the foundational relationship between grace, faith, and good works. Falling right after Reformation Day, the message recalled Martin Luther''s protest against selling indulgences, highlighting the timeless question of how someone is truly saved. Pastor Pete emphasized that our higher calling is not about performing for God to earn his favor, but resting in our relationship with him. The gospel brings a simple clarity to our lives: good works do not produce salvation, but salvation naturally produces good works.'
  - Looking closely at the passage, Pastor Pete reminded us that apart from Christ, we were spiritually dead and unable to fix our brokenness. Just like the paralyzed man lowered through the roof in Mark 2, we could not even come to Jesus on our own, yet Jesus extended forgiveness before the man even asked. Grace is entirely unmerited, yet our culture trains us to treat gifts as debts. Pastor Pete illustrated this with the awkwardness of trying to pay cash for a hand-knit hat. Attempting to earn or repay God cheapens grace, turning a loving gift into a transaction.
  - Because salvation is an unearned gift received through faith, Paul writes that no one can boast. Pastor Pete noted that faith functions like a train coupling, holding no power of its own but simply connecting us to Christ's power. When we catch ourselves looking down on others, comparing spiritual resumes, or growing impatient with people who struggle, we expose a lingering belief that our own effort made us right with God. Instead of maintaining self-righteous scorecards, Ephesians 2:10 calls us God's workmanship, or masterpiece, formed in Christ to participate in the good purposes he already prepared for us.
  - Pastor Pete shared a childhood memory of building a wooden bed with his father, showing that serving God is meant to be a joyful partnership rather than an exhausting obligation. When God's grace truly takes root, we are liberated from fear and shame. We are invited to step into good works, whether through mission trips, serving our local neighbors, or raising our families. Pastor Pete urged us to reject transactional faith, choose to celebrate others instead of competing, and actively offer forgiveness before anyone even asks.
one_thing: Good works do not lead to salvation, but salvation leads to good works as we joyfully join in the purposes God prepared for us.
discussion_questions:
  Connecting:
    - What is the most thoughtful handmade gift you have ever received from someone?
    - Why do people often feel an urge to immediately repay someone who gives them a present?
  Considering:
    - According to Ephesians 2:8-9, why does God emphasize that salvation is a gift rather than a result of works?
    - In Ephesians 2:10, what does being God's workmanship imply about the origin and purpose of our good deeds?
  Confessing:
    - In what areas of your life do you catch yourself quietly comparing your spiritual efforts to others?
    - Where are you tempted to view your service to God as a burdensome debt rather than a joy?
  Committing:
    - Who is one person you will choose to encourage and lift up this week instead of competing with them?
    - What is one specific relationship where you will take the initiative to offer or ask for forgiveness this week?
next_steps:
  - Pray about joining upcoming mission opportunities, such as the Chicago Missions Project or international initiatives through AMI.
  - Intentionally celebrate and elevate someone else in conversation this week instead of trying to one-up them.
  - Initiate reconciliation with someone by asking for forgiveness or freely offering it before they even ask.
