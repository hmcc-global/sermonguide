series: Higher Calling
part: Part 8
date: '2026-11-15'
preacher: Pastor Sam
scripture_title: Ephesians 2:11-22
scripture_ref: Ephesians 2:11-22
recap:
  - 'Pastor Sam opened with several stories of universities caught editing photos to fake diversity in their marketing, including a recent case at Stanford. He used them to name a tension many of us know: we say we want diversity and unity, but it is hard to build real relationships with people who are different from us, whether across racial, political, or generational lines. He turned to Psalm 133 and Ephesians 2:11-22 to ask how the church can be both unified and diverse. His one thing was that we are called to live out the unity God established for his diverse people, and he walked through three steps for doing it.'
  - The first step is to remember that you were once not part of God's people. Paul tells Gentile believers they were alienated from Israel, strangers to the covenants of promise, and without hope and without God. Pastor Sam noted that remembering runs through Scripture, from the Passover meal in Exodus 12 to the weekly Sabbath in Deuteronomy 5:15, and that this is why we call our gathering a Sunday celebration. Remembering our life before Christ, or our family's life before Christ if we grew up in the church, keeps us hungry for people who still do not know him, which fits the church's missions month, and keeps us hopeful, since the same God who pursued us is still ours. He suggested Thanksgiving as a practical time to ask family members to remember God's grace together.
  - 'The second step is to rejoice that Jesus made us one reconciled people. Pastor Sam described the hostility between Jews and Gentiles as thousands of years old, far deeper than modern rivalries, and said it showed up physically in the wall in the temple courts that barred Gentiles from the inner area. Christ tore down that dividing wall by fulfilling the law and taking its punishment, so there is now only one way to be right with God, which is to trust Jesus. As he put it, there is just one group in Christ: sinners who realize they need a Savior. This leads to humility, and humility kills hostility, because we cannot look down on others when we know we needed grace just as much. We can still disagree, correct, and persuade, but not from pride, whether the difference is racial, political, or generational.'
  - 'The third step is to realize our identity as a unified and diverse people. Paul says Gentile believers are fellow citizens, members of God''s household, and part of one temple built on one foundation, with Christ as the cornerstone. Pastor Sam said this is why the church wants to be a transcultural spiritual family reaching our neighbors, the nations, and the next generation, and that we are not creating this unity but taking part in what God has already done. He closed with three practical responses: repent where we have settled for shallow diversity or stereotyped others, receive God''s promises with confidence instead of letting insecurity say we do not belong, and do the real work of building unity by relying on the Spirit. He ended with Revelation 7:9-10, where a multitude from every nation worships together, as a unity worth fighting for now.'
one_thing: Live out the unity God established for his diverse people.
discussion_questions:
  Connecting:
    - Have you ever been part of a group that looked diverse on the outside but felt divided or shallow on the inside?
    - What is one tradition or time in your year when you take time to remember and give thanks?
  Considering:
    - In Ephesians 2:11-13, how does Paul describe the Gentiles' condition before Christ, and what changed?
    - According to verses 14-18, how did Jesus break down the dividing wall of hostility, and what does verse 19 say we now are?
  Confessing:
    - Is there a group or kind of person you tend to avoid, stereotype, or write off? What is behind that?
    - Where do insecurity or a sense that you do not belong keep you from fully taking your place in God's family?
  Committing:
    - What is one concrete step you could take this month to get to know someone who is different from you and learn how they see God?
    - How could you create a time to remember God's grace with your family or friends this Thanksgiving?
next_steps:
  - Spend 10 minutes remembering your life, or your family's life, before Christ, and thank God for pursuing you.
  - Confess to God one area where you have stereotyped or kept your distance from others, and ask him to give you his heart for them.
  - Invite someone from a different background, age group, or perspective to a meal and ask them how they have come to know God.
