series: '1 John 1:5-10: Walking in the Light'
date: '2026-10-11'
preacher: Pastor Pete Dahlem
scripture_title: 1 John 1:5-10
scripture_ref: 1 John 1:5-10
recap:
  - This Sunday Celebration was different from a normal week. Pastor Pete acknowledged that high-profile failures of church leaders have become common in the culture, and that churches have often covered up bad behavior, especially from gifted or charismatic leaders. He then shared an update about the church's former pastor, Seth Kim, who led the church from 1996 to 2015. He read a written statement, prepared with two survivors. The elders believe the reports are true, thanked the survivors for their courage, apologized to them, and stated that Seth has permanently disqualified himself from pastoral ministry. Details were kept out of the statement to protect the survivors' confidentiality, and a Q&A and prayer team were made available after the service.
  - 'From 1 John 1:5-10, Pastor Pete began with trusting God''s character. God is light and in him is no darkness at all, and that cannot be said of any person, including a pastor. He shared that this season exposed how easily people place trust in a leader instead of in God, and that the deepest struggles with events like these often grow from that. Trustworthy leadership is good and taught in Scripture, but following Jesus must rest on trusting God first. From verses 8 and 10, he said the church must call sin, sin, with no denying, covering up, blaming the victim, or minimizing. He also said the church should grieve, and he shared the loss of his family cat the day before as a picture of why real loss deserves real mourning. He named those worth grieving for: the survivors, Seth''s family, those who served under Seth''s leadership, the church''s witness, and others who have suffered similar harm.'
  - 'Pastor Pete then spoke about bringing darkness into the light. Citing 1 Timothy 5:19-20, he explained that public correction should match the scope of a person''s public ministry. It calls the person to repentance, and it leads everyone else to take sin seriously and stand in the fear of God. Real repentance is available even to the worst of sinners, but it would look like full public confession, sincere amends, submission to outside oversight, and long-term character change, and restoration means fellowship with the church, not a return to pastoral office. He described changes the church has already made, including an anonymous reporting pathway, an elder-led model of leadership instead of a single decision-maker, security cameras, and regular accountability among the pastors. He also called each person to self-examination: whether we welcome accountability, whether we speak up when we see something concerning, and whether we will call our own sin by its name. He quoted Solzhenitsyn that the line between good and evil runs through every human heart, and said that in cases of serious misconduct, a person should not feel they must confront the individual first and can ask others for help right away.'
  - Pastor Pete closed by turning to Jesus, from verses 7 and 9. We turn to him because he is light, because his blood cleanses sin, and because he is building his church. The cross shows both the forgiveness and the justice of God, and Jesus will return to make all things right. Forgiveness is not permissiveness, but it does protect us from bitterness taking root, and Christ died to free us from hatred and anger as well as guilt. He described even this painful process as part of Jesus purifying his bride. The service ended with communion, with an invitation to bring anger, grief, fear, guilt, or shame to the Lord, and an open invitation to anyone not yet following Jesus to place their faith in him.
one_thing: Trust God alone, call sin what it is, and bring it to Jesus in the light.
discussion_questions:
  Connecting:
    - Who is someone outside your family that you have come to trust deeply, and what made them trustworthy to you?
    - When you have had to share hard news with people you care about, what helped you do it well?
  Considering:
    - According to 1 John 1:5, what is true of God's character, and why does that matter when serious sin happens, especially in a leader?
    - What does verse 7 and verse 9 say Jesus does for those who walk in the light and confess their sins?
  Confessing:
    - Is there a leader or friend whose place in your faith has become closer to the place only God should hold?
    - Is there sin in your own life that you have minimized, explained away, or kept hidden instead of naming plainly?
  Committing:
    - Who could you invite into honest accountability, and what would you want them to ask you?
    - Is there anyone you need to forgive, or any bitterness you need to bring to the cross?
next_steps:
  - Take 10 minutes this week to name before God one sin you have been minimizing, and confess it to him.
  - Ask one trusted believer to check in with you regularly about how you are really doing spiritually.
  - Pray for the survivors, for Seth's repentance, and for those in the church who are grieving, and reach out to a pastor or elder if you want support or have questions.
