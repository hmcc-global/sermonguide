series: HIGHER CALLING
part: 'Part [N]: Ephesians 2:1-7'
date: '2026-10-25'
preacher: Pastor Pete
scripture_title: Ephesians 2:1-7
scripture_ref: Ephesians 2:1-7
recap:
  - 'Pastor Pete framed the passage in two movements: remembering our spiritual condition, then rejoicing in God''s mercy and grace. Since the year''s theme is a higher calling, he noted that it implies a lower calling many of us have been living in. Verses 1-3 describe the world, the flesh, and the devil. Following the course of the world is like a leaf drifting along a river, passively conforming to things like moral relativism, consumerism, and radical individualism, whether that shows up as using AI to cheat because everyone else does or as shopping for a spouse, friends, or a church. Behind that current are real rebellious spiritual powers working through deception, temptation, and destruction, and underneath both is our own flesh, which gives in without anyone teaching it to. Together these make us "children of wrath," a phrase describing our nature and our standing under God''s holy judgment, and leave us dead in trespasses and sins.'
  - Pastor Pete pressed the point that this condition is not only a description of our past. Spiritual death means separation from God, slavery to sin, and blindness that cannot help, save, or change itself. Quoting Paul David Tripp, he noted that spiritually blind people tend to be blind to their blindness, which is why Paul prayed in chapter 1 for the eyes of our hearts to be enlightened. He asked believers whether they are still drifting with the world, yielding to temptation, or indulging the flesh, and invited those exploring faith to consider whether their restlessness is a sign that the way of the world is not leading to life.
  - The turn comes with the words "but God" in verse 4. Pastor Pete observed that the passage does not say we tried harder or proved ourselves worthy. God is rich in mercy, sees us in serious need, and responds with compassion instead of only anger, loving us even while we were dead. He stressed that God loves us because he is love, not because we are lovable. From there Paul builds an escalating sequence. God made us alive with Christ, which goes beyond removing guilt to giving eternal life, and he pointed to baptism as the picture of dying and rising with Jesus. God saved us by grace, which Alistair Begg describes as saved from sin's penalty, being saved from its power, and one day saved from its presence. God also raised us and seated us with Christ, who is exalted above every power, so we are free and empowered to follow the Spirit and obey Christ instead of the world and the flesh. Revelation 12:9-11 shows that believers overcome by the blood of the Lamb and the word of their testimony.
  - Verse 7 says God did all this to show the immeasurable riches of his kindness toward us in Christ. Pastor Pete asked what actually motivates our faith, and said many of us still run on an old operating system of fear, performance, comparison, insecurity, and consumerism, even while knowing the truth. The new one runs on love, mercy, and grace, so that serving, praying, reading Scripture, and showing up to life group come from gratitude rather than guilt or the need to prove ourselves. He summed up our higher calling as receiving God's grace and rejoicing in his love, and suggested that the gap between where we are and our full inheritance is bridged by prayer and steps of faith. His practical suggestion for the week was to read these seven verses daily and ask God to change our motivations.
one_thing: Receive God's grace and rejoice in his love as the foundation for everything you do.
discussion_questions:
  Connecting:
    - Can you think of a time you went along with something just because everyone else was doing it?
    - What is one thing you do regularly out of habit or obligation that you would love to do out of joy instead?
  Considering:
    - In Ephesians 2:1-3, what three influences does Paul name, and what is the result for those who follow them?
    - What changes in verses 4-7 after the words "but God," and what does each phrase (made alive, saved by grace, raised and seated with Christ) add?
  Confessing:
    - Which of the three influences (the world, spiritual opposition, or your own flesh) do you most often give in to?
    - 'When you serve, pray, or read the Bible, what motivation tends to drive you: guilt, performance, comparison, or gratitude?'
  Committing:
    - What would change in your week if you did one thing you usually do out of obligation as a response to God's kindness instead?
    - What is one step of faith or prayer you could take to move from the old operating system to the new one?
next_steps:
  - Read Ephesians 2:1-7 each morning this week and pray that God would change your motivations.
  - Pick one area where you act out of guilt, performance, or insecurity, and ask God to show you what it looks like to do it out of gratitude.
  - Share with a friend or life group what you are seeing about your old and new motivations, and pray for each other.
