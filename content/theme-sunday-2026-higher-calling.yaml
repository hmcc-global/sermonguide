series: Theme Sunday 2026
part: Higher Calling
date: '2026-09-13'
preacher: Pastor Pete Dahlem
scripture_title: Ephesians 1:1-2
scripture_ref: Ephesians 1:1-2
recap:
  - Pastor Pete Dahlem introduced HMCC's annual theme for the year, Higher Calling, based on Ephesians 1:1-2. Drawing connections to iconic movies like Star Wars, The Matrix, and Encanto, he noted how audiences across generations resonate with ordinary characters who long for something greater than their routine existence. That universal longing is not an accident, but points to our deeper human design. Over the next eight months, our study of Ephesians will challenge us to rise above temporary pursuits and devote our daily lives to God's eternal purpose.
  - Looking at the opening greeting of the letter, Pastor Pete examined how Paul became an apostle through the will of God. Long before his ministry began, God established sovereign foundations in Paul's life, from his Roman citizenship to his elite training under Gamaliel. Even so, all Paul's achievements meant nothing until he met the risen Jesus on the road to Damascus. God's purpose then unfolded within Christian community, where believers like Ananias and Barnabas welcomed and mentored him. Pastor Pete reminded us that God's sovereignty works through what he ordains and what he redeems, using even our past failures and hardships to accomplish his plans.
  - In Ephesians 1:1, Paul writes to the saints in Ephesus, a word often associated with stained glass windows and gold halos. Pastor Pete pointed out that in Scripture, every person who belongs to Jesus is called a saint. Many believers suffer from a low expectation of normal Christian life, assuming God only works through a select few. Instead, every Christian is called to an intimate walk with God, a vibrant life of faith, and active ministry. Pastor Pete shared a vision of a child on a diving board, urging us not to retreat in fear when God invites us to take bold leaps of obedience.
  - Using The Incredibles as a closing example, Pastor Pete illustrated that true purpose is never found through solo heroics. Mr. Incredible discovered his calling was lived out not by escaping his family, but by protecting and laboring alongside them. Paul's own life required parents, teachers, and coworkers like Timothy to fulfill his race. Pastor Pete urged us to see the church as a spiritual family where we discover our gifts by serving together, relying on God's grace to guide us into our higher calling.
one_thing: A higher calling means rising above temporary pursuits to live for God's eternal purpose together as a spiritual family.
discussion_questions:
  Connecting:
    - Which fictional hero or movie character had the most memorable turning point in their story?
    - What is an activity or hobby that instantly makes you lose track of time?
  Considering:
    - In Ephesians 1:1, how does Paul identify himself and the people he is writing to?
    - According to Ephesians 1:2, what two gifts does God our Father extend to his people?
  Confessing:
    - Where have you settled for a low expectation of what God can do through your life?
    - What temporary pursuit currently distracts you the most from focusing on God's eternal purpose?
  Committing:
    - What is one practical step of faith you can take this week instead of stepping back in hesitation?
    - Who is one person in your church family you can reach out to encourage this week?
next_steps:
  - Reflect in prayer on your life story to identify what God has ordained and redeemed.
  - Begin serving in a local church ministry this month to help discover and develop your spiritual gifts.
  - Mark your calendar to attend the Experiencing God series on Friday nights starting in late October.
