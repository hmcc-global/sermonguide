series: Higher Callling
part: Part 2
date: '2026-09-20'
preacher: Pastor Pete Dahlem
scripture_title: Ephesians 1:3-6
scripture_ref: Ephesians 1:3-6
recap:
  - Pastor Pete continued the Higher Calling series by grounding our calling in who we are rather than merely what we do. After thanking church members who stepped up to mop up an unexpected water leak during recent concrete work, he shared a parable of three bricklayers. While two saw their daily work as merely laying bricks or collecting a paycheck, the third saw himself building a grand cathedral. In opening Ephesians 1:3-6, Pastor Pete explained that rising to our higher calling requires seeing the bigger purpose God has for our lives, starting with receiving our spiritual identity in Christ.
  - In verse 3, Paul praises God for blessing us with every spiritual blessing in the heavenly places. Pastor Pete distinguished general blessings, which are common graces available to all humanity, from the specific inheritance given only to those in Christ. Turning to the challenging language of election and predestination in verses 4 and 5, he outlined how different traditions balance God's sovereignty and human responsibility, using the picture of his young son learning a judo throw with an instructor guiding the momentum. Ultimately, God's choice to adopt us does not depend on our performance, but entirely on his sovereign love deciding before the foundation of the world to call foolish sinners to himself.
  - Because of what Jesus accomplished through his sinless life, sacrificial death, and resurrection, believers are declared holy and blameless before God. Pastor Pete reminded us of figure skater Scott Hamilton, whose mother comforted him against schoolyard teasing by noting that while other parents got stuck with whatever arrived, his parents actively chose to adopt him. In Christ, we are not treated like criminals facing a distant courtroom judge, but as cherished sons and daughters welcomed into a loving family. We have an eternal standing that can never be lost because it was never earned in the first place.
  - Our natural response to this adoption is joyful worship. Pastor Pete noted that Paul wraps this entire passage in praise, urging us to stop relating to Scripture like a confusing furniture assembly manual or an accusatory parking ticket. Instead, God's Word acts as an adoption certificate welcoming us home out of the orphanage. Before rushing to perform kingdom tasks, we are invited to enjoy intimate relationship with our heavenly Father. He encouraged us to rejoice in this adoption, to study our identity in Christ, and to intentionally create spaces for personal and corporate intimacy with God.
one_thing: Our higher calling begins not with what we do for God, but with rejoicing in the secure blessing of being his chosen, adopted children.
discussion_questions:
  Connecting:
    - What is an assembly manual or set of instructions you found impossible to follow?
    - When you pass by a major construction site, what usually catches your attention first?
  Considering:
    - According to Ephesians 1:3-4, when did God choose believers and for what ultimate purpose?
    - In Ephesians 1:5-6, what motivated God to predestine believers for adoption into his family?
  Confessing:
    - Where do you tend to act like an orphan trying to earn God's approval instead of an adopted child?
    - What makes it difficult for you to rest in God's love when you confront your own foolish mistakes?
  Committing:
    - What is one specific time this week you will set aside simply to enjoy quiet fellowship with God?
    - Which identity truth from Scripture will you memorize and pray through over the next seven days?
next_steps:
  - Rejoice daily in the blessing and security of being God's chosen, adopted child.
  - Review and journal through a scripture resource focused on who you are in Christ.
  - Make intentional space for intimacy with God through personal worship and church prayer gatherings.
