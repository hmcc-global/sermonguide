series: Our Vision
part: Part 2
date: '2026-09-06'
preacher: Pastor Pete Dahlem
scripture_title: Acts 13:1-3
scripture_ref: Acts 13:1-3
recap:
  - As we continued our vision series, Pastor Pete walked us through Acts 13:1-3 to explore what it means to be a transcultural spiritual family reaching our neighbors, the nations, and the next generation. Just as an orchestra brings together distinct instruments into one harmonious melody, God designs the church to unite people from every background around Jesus. Pastor Pete reminded us that this vision is not a clever church strategy. It comes straight from the scriptures and reflects God's heart for His people.
  - Looking closely at Antioch, Pastor Pete noted that this was the very first Gentile church. When early believers scattered after Stephen was martyred, most shared the gospel only with other Jews. But in Antioch, some believers chose to step across cultural lines to preach Jesus to Greek-speaking Hellenists. Through modern examples like actors and musicians attempting dramatic career crossovers, Pastor Pete pointed out how difficult it is to step from the familiar into the unfamiliar. Yet the gospel is powerful enough to connect with every language, culture, and walk of life.
  - The leadership at Antioch in Acts 13:1 reveals an astonishing picture of gospel reconciliation. Men from North Africa, Cyprus, and Rome served together alongside Saul, who had previously overseen the deadly persecution that scattered believers in the first place. Pastor Pete pointed out that genuine community is far deeper than mere demographic diversity. It is a story of redemption where former enemies worship side by side because Christ died for all of them. In Antioch, believers were first called Christians because their sole common bond was Jesus rather than a shared ethnicity.
  - Finally, Acts 13:2-3 shows a church led by the Holy Spirit through corporate worship, prayer, and fasting. Instead of asking what God wanted them to accomplish on their own, the church sought to join what the Spirit was already doing. Pastor Pete urged us to step out of our comfort zones for the sake of the gospel right here where we live, study, and work. When we fix our eyes on Jesus together, He creates a supernatural unity that displays the truth of His kingdom to the surrounding world.
one_thing: Being a transcultural spiritual family means choosing discomfort to cross cultural boundaries for the sake of the gospel, united solely around Jesus.
discussion_questions:
  Connecting:
    - What is one favorite food or tradition from your family or cultural background?
    - When have you tried a completely new hobby or style that felt totally foreign at first?
  Considering:
    - According to Acts 13:1, what varied backgrounds and places of origin did the leaders in Antioch represent?
    - In Acts 13:2-3, what spiritual practices prepared the church to hear and obey the Holy Spirit?
  Confessing:
    - Where do you find yourself preferring comfortable relationships instead of reaching out to people unlike yourself?
    - What past wounds or relational barriers make it difficult for you to trust others in Christian community?
  Committing:
    - What is one question you can ask someone from a different background this week to learn about their culture?
    - Which specific ministry or life group role will you step into this month to serve the church family?
next_steps:
  - Join and actively engage in a Life Froup to practice gospel forgiveness and grace in community.
  - Ask someone from a different background about what they love most about their culture.
  - Identify and begin using your personal spiritual gifts to serve your church family.
