series: HIGHER CALLING
part: Part 3
date: '2026-09-27'
preacher: Pastor Pete Dahlem
scripture_title: Ephesians 1:7-10
scripture_ref: Ephesians 1:7-10
recap:
  - 'Continuing through Ephesians as part of the church''s higher calling theme, Pastor Pete opened with the story of the Troubles in Northern Ireland, a 30 year conflict between mostly Catholic nationalists and mostly Protestant unionists that killed over 3,600 people. In the middle of that division, believers like the Corrymeela community brought Protestants and Catholics together to live, eat, and pray, and some who lost family members publicly forgave the killers, contributing to the eventual Good Friday Agreement in 1998. Pastor Pete used this as a picture of the gospel''s power to reconcile, but pointed to Ephesians 1:7-10 for something even greater: God''s plan to unite all things in Christ.'
  - 'Digging into the Greek behind the passage, Pastor Pete explained that redemption (apolytrosis) means being freed from slavery, and forgiveness (aphesis) means having guilt removed. Understanding what Jesus did requires being honest about what sin does first: it makes us guilty and enslaved. He described how a small dishonesty, like lying about the toilet seat, tends to snowball into more lies to cover the first one, illustrating how sin snares people the way Proverbs 5:22 describes. Referencing Genesis 2 and a favorite painting by Thomas Cole where Adam and Eve are barely visible in a vast garden, he noted that even one act of disobedience carried the weight of death, since, as J.I. Packer wrote, there are no small sins against a great God.'
  - 'Turning to the good news, Pastor Pete traced how Jesus fulfills what the Old Testament sacrificial system and the Passover pointed toward, quoting Leviticus 17:11 on blood and atonement, Exodus 12 on the Passover lamb, and Hebrews 9 and 10 on Christ''s one sacrifice replacing the repeated sacrifices of the old covenant. He unpacked "the riches of his grace" with an extended illustration about a college student in debt encountering Larry Page on the Diag: giving out of your riches is a $100 bill, giving according to your riches is paying off the whole debt, providing housing, and offering a job. That is the scale of what God has done through Christ.'
  - 'Pastor Pete then turned to the mystery of God''s will, God''s plan to unite all things in heaven and earth in Christ, pointing to Revelation 21 as the ultimate picture of that promise. He acknowledged that parts of Christian faith remain genuinely mysterious, drawing on conversations he''s had with Muslims about the Trinity to argue that a God we could fully explain would be too small to be God. He closed with a personal story of harboring bitterness toward a fellow leader years ago, expressing it through passive aggressive comments rather than direct confrontation, until a brother confronted him and he had to confess and ask forgiveness. The point: many of us hide, justify, compare, or try to earn our way out of guilt, when the debt has already been paid by Jesus, and we''re invited to live honestly in that freedom with God and with each other.'
one_thing: Trust God's gracious plan to unite all things in Christ.
discussion_questions:
  Connecting:
    - If someone offered to pay off all your debt and set you up with a job and a place to live, how do you think you'd react?
    - What's a small lie or excuse you've seen snowball into something much bigger, in a movie, a story, or life?
  Considering:
    - In Ephesians 1:7-10, what specific things does Paul say we have "in him," and what do those words (redemption, forgiveness, grace) mean?
    - How do Old Testament pictures like the Passover lamb or the sacrificial system in Leviticus connect to what Paul says Jesus accomplished?
  Confessing:
    - Do you tend to deal with your own sin by hiding it, justifying it, or comparing yourself to someone "worse"?
    - Is there a conflict, grudge, or unspoken tension with someone that you've been avoiding rather than bringing into the light?
  Committing:
    - What is one step of faith, however small, God might be asking you to take this week regarding something you've been hiding?
    - Who is someone you need to have an honest conversation with in order to pursue unity rather than avoidance?
next_steps:
  - Bring one specific sin or struggle honestly to God this week instead of hiding, justifying, or comparing it to others.
  - If there's a broken relationship or unspoken conflict, take a step toward reconciliation rather than avoidance.
  - Spend time in prayer resting in the truth that your debt has already been paid by Jesus.
