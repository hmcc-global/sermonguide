series: HIGHER CALLING
part: 'Part 3: Ephesians 1:11-14'
date: '2026-10-04'
preacher: Pastor Pete
scripture_title: Ephesians 1:11-14
scripture_ref: Ephesians 1:11-14
recap:
  - Continuing through Ephesians as part of the church's higher calling theme, Pastor Pete opened with the story of The Count of Monte Cristo, where Edmond Dantes escapes false imprisonment and discovers a hidden treasure that transforms his entire life. In the same way, Pastor Pete said, our inheritance in Christ is meant to completely change how we live, not toward revenge like Dantes, but into full freedom as adopted sons and daughters of God. He then read Ephesians 1:11-14, which describes this inheritance as something obtained and guaranteed.
  - 'Working through the passage, Pastor Pete pointed out two parallel threads: being "in him," referring to Jesus, used repeatedly throughout chapter 1, and the shift from "we" (likely the apostles or Jewish believers who first hoped in Christ) to "you" (the Gentile believers in Ephesus). Despite that difference in timing, he emphasized that the inheritance itself is the same for everyone, just like the laborers in Jesus''s parable in Matthew 20 who all received the same wage regardless of when they started. He explained that "we have obtained" is grammatically passive, meaning the inheritance was accomplished by Christ and simply received by us, comparing it to having a meal unexpectedly paid for at a restaurant. He also unpacked the Greek words behind being "sealed" (sphragizo, marking ownership and security) and "guaranteed" (arrabon, a down payment pledging the rest will come), explaining that the Holy Spirit is that down payment on the fuller inheritance still to come.'
  - 'From there Pastor Pete pivoted to application, naming that this inheritance makes every believer extraordinarily wealthy and asking what that means practically. He walked through research on the common struggles of children raised in extreme wealth, elevated anxiety, learned helplessness, moral impunity, and emotional distance, illustrated by the real case of Ethan Couch, whose "affluenza" defense kept him out of jail after killing four people while driving drunk. He contrasted this with healthy parenting marked by unconditional love, firm boundaries, real responsibilities, encouragement to take risks, and using resources to serve others. He applied this directly to our relationship with God: God does not want to spoil us by removing every struggle, but instead matures us through trials so we grow secure, confident, and bold rather than entitled, referencing Paul''s own experience that God''s grace is sufficient and his power made perfect in weakness.'
  - Pastor Pete closed by returning to the phrase "to the praise of his glory," noting this inheritance isn't ultimately about us but about worshiping the Father who planned it, the Son who obtained it, and the Spirit who seals it. He offered three reflection questions, where our security is rooted, whether we trust God to mature us through difficulty, and how real confidence in this inheritance would change the way we live, encouraging the church to surrender areas where they've been relying on performance rather than resting in what's already been given.
one_thing: Live with security and confidence because of your inheritance in Christ.
discussion_questions:
  Connecting:
    - If you unexpectedly found out someone had already paid your bill at a restaurant, how would that feel?
    - Growing up, what's one value or boundary your parents gave you that you're grateful for now?
  Considering:
    - In Ephesians 1:11-14, what does it mean that our inheritance has been "obtained," and who performs that action?
    - What do the words "sealed" and "guaranteed" mean in verse 13-14, and what role does the Holy Spirit play?
  Confessing:
    - Where do you tend to find your security and confidence, in Christ or in your own performance and achievement?
    - Is there a struggle or trial in your life where you've been asking God to simply remove it rather than mature you through it?
  Committing:
    - What is one area where you've been relying on your own performance rather than resting in your inheritance in Christ?
    - What would taking a bold step of faith look like for you if you truly trusted your inheritance is secure?
next_steps:
  - Identify one area of life where you've been trusting your own performance, and surrender it to God this week.
  - Spend time in prayer thanking God for the Holy Spirit as the guarantee of your inheritance.
  - Reflect on a past trial where God matured you rather than removed the struggle, and thank him for it.
