series: Higher Calling
part: Part 5
date: '2026-10-18'
preacher: Pastor Pete Dahlem
scripture_title: Ephesians 1:15-23
scripture_ref: Ephesians 1:15-23
recap:
  - In part five of the Higher Calling series, Pastor Pete led us into Ephesians 1:15-23 to explore the vital priority of prayer for our church family. After walking through a heavy season of addressing past church hurt and leadership failure, Pastor Pete emphasized that moving forward requires deep dependence on God. While Paul rejoiced over the genuine faith and love of the Ephesian believers, he knew that sound teaching and human effort alone could never bring them to spiritual maturity.
  - 'Pastor Pete pointed out that our motivation to pray comes from two realities: our secure inheritance in Christ and the work of God we see in others. Just as a household keeps an abundant stash of favorite drinks stocked in the fridge, God has lavished spiritual riches on us that are freely available right now through the Holy Spirit. Furthermore, when we notice spiritual potential in brothers and sisters, like a mentor spotting promise in an unlikely student, genuine love moves us beyond merely trying to help them in our own strength to lifting them up before God.'
  - Looking at Paul's prayer as a model, Pastor Pete highlighted that spiritual growth requires supernatural revelation, not just acquiring biblical facts. Paul prayed for the eyes of their hearts to be enlightened so they could grasp both the hope of their calling and God's immeasurable power. This is the very same power that raised Jesus from the dead and placed him far above every spiritual authority as head over the church. When we begin to truly perceive this resurrection power with our hearts, fear and discouragement give way to real security and bold faith.
  - Pastor Pete concluded by calling us to embrace our own personal ministry of prayer. Rather than relying on human skill or self-sufficiency, we are called to pray biblically, consistently, and confidently. Pastor Pete challenged each of us to take Ephesians 1:15-23 this week and pray it daily by name for our families, friends, or life group members. When we root our lives in Scripture-fed intercession, we invite God to do what only he can do in building up his people.
one_thing: Our higher calling is to pray without ceasing as we see God working.
discussion_questions:
  Connecting:
    - What is a favorite comfort food or drink you always keep stocked at home?
    - Who is a memorable movie character that had great potential but needed help discovering it?
  Considering:
    - In Ephesians 1:17-19, what three specific realities does Paul ask God to reveal to the believers?
    - According to Ephesians 1:20-23, how does the passage describe Christ's power and position over all other authorities?
  Confessing:
    - Where do you tend to rely on your own effort instead of depending on God through prayer?
    - How often do your daily prayers focus on physical comfort rather than deeper spiritual maturity?
  Committing:
    - Who is one specific person you will commit to praying for each day this week?
    - What regular time will you set aside on your calendar this week for intentional intercession?
next_steps:
  - Pray through Ephesians 1:15-23 daily for a family member, friend, or life group member by name.
  - Block out ten to fifteen minutes on your calendar each day dedicated specifically to prayer.
  - Practice praying Scripture out loud with an open Bible to help sharpen your spiritual focus.
